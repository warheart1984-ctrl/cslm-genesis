[project]
name = "cslm-genesis"
version = "0.0.1"
description = "Language organ: answers release only under an auditable JCR decision."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CSLM-Genesis" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cslm = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "live: hits project Ollama on 11435; skipped when the server is down",
]
